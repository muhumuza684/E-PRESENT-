<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Presence Lecturer | BrytMa Tech Uganda</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f8;color:#111;min-height:100vh;display:flex;flex-direction:column}
  main{width:100%;max-width:460px;margin:0 auto;padding:16px;flex:1}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .logo{background:#0b5cad;color:#fff;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:1.2rem}
  .brand b{display:block;font-size:1.1rem}.brand span{font-size:.75rem;color:#555}
  h1{font-size:1.3rem;margin:8px 0}
  label{display:block;margin-top:10px;font-weight:600;font-size:.9rem}
  input[type=text],input[type=email],textarea{width:100%;font-size:16px;padding:12px;margin-top:4px;border:2px solid #8a8f98;border-radius:10px;background:#fff;font-family:inherit}
  .chk{display:flex;gap:8px;align-items:center;font-weight:500;margin-top:12px}.chk input{width:20px;height:20px}
  button{width:100%;font-size:1.05rem;padding:13px;margin-top:12px;border:0;border-radius:10px;background:#0b5cad;color:#fff;font-weight:700}
  button.sec{background:#fff;color:#0b5cad;border:2px solid #0b5cad}
  button.red{background:#b42318}
  button.link{background:none;color:#0b5cad;font-weight:600;padding:8px;margin-top:4px;font-size:.9rem}
  .row{display:flex;gap:8px}.row button{margin-top:12px}
  .msg{margin-top:10px;padding:10px;border-radius:10px;font-weight:600;display:none;font-size:.95rem}
  .ok{background:#d6f5dc;color:#0a5c1f}.err{background:#fde0e0;color:#8a1111}
  #pinbox{text-align:center;background:#fff;border:2px solid #0b5cad;border-radius:14px;padding:8px;margin-top:8px}
  #pinbox small{color:#555;display:block}#pinval{font-size:3rem;font-weight:800;letter-spacing:.35rem;line-height:1.1;word-break:break-all}
  #qr{display:flex;justify-content:center;margin:12px 0 4px}#qr img,#qr canvas{max-width:100%}
  .count{text-align:center;font-weight:700;font-size:1.1rem;margin-top:6px}
  .scroll{max-height:36vh;overflow:auto;background:#fff;border-radius:10px;margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{padding:7px 8px;border-bottom:1px solid #e3e3e3;text-align:left}
  details{margin-top:10px;background:#fff;border-radius:10px;padding:8px 10px}summary{font-weight:600;cursor:pointer}
  .foot{font-size:.75rem;color:#666;text-align:center;padding:10px}
  .pbrand{display:none;text-align:center;font-size:.8rem;color:#555;margin-top:12px}
  @media print{
    main>*{display:none}body.pl #listbox{display:block}.noprint{display:none!important}.scroll{max-height:none;overflow:visible}.pbrand{display:block}.foot{display:none}
  }
</style>
</head>
<body>
<main>
  <header class="brand"><div class="logo">E</div><div><b>E-Presence</b><span>BrytMa Tech Uganda</span></div></header>

  <section id="setup">
    <h1>New sign-in</h1>
    <label>Session name<input id="sname" type="text" placeholder="e.g. CSC2101 Week 5 lecture" maxlength="80"></label>
    <label>PIN students must type<input id="spin" type="text" maxlength="10" autocomplete="off"></label>
    <label>Email me the list (optional)<input id="email" type="email" placeholder="you@university.ac.ug"></label>
    <label class="chk"><input id="askreg" type="checkbox" checked>Students also type a Reg No</label>
    <button id="start">Start sign-in</button>
    <div id="m1" class="msg"></div>
  </section>

  <section id="live" style="display:none">
    <h1 id="lname"></h1>
    <div id="pinbox"><small id="pinlabel">Students enter this PIN</small><div id="pinval"></div></div>
    <div id="qrwrap"><div id="qr"></div><div style="text-align:center;font-size:.85rem;color:#555">Students scan this QR code</div></div>
    <div class="count" id="count"></div>
    <div class="row"><button class="sec" id="viewlist">List &amp; export</button><button class="sec" id="chpin">Change PIN</button></div>
    <div class="row"><button class="red" id="end">End sign-in</button><button class="sec" id="newsess">New session</button></div>
  </section>

  <section id="listbox" style="display:none">
    <h1 id="ptitle"></h1>
    <div class="scroll"><table id="tbl"></table></div>
    <div class="pbrand">E-Presence by BrytMa Tech Uganda</div>
    <div class="noprint">
      <div class="row"><button id="csv">Download CSV</button><button id="pdf">Save as PDF</button></div>
      <button class="sec" id="mail">Email me the list</button>
      <details><summary>Add someone by hand</summary>
        <textarea id="paste" rows="4" placeholder="Paste from Google Sheets: Reg No and Name, one person per row"></textarea>
        <button id="addbtn">Add to list</button>
      </details>
      <div id="m2" class="msg"></div>
      <button class="link" id="back">&larr; Back</button>
    </div>
  </section>
</main>
<p class="foot">Built in Uganda by BrytMa Tech Uganda</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const URL_ = 'https://script.google.com/macros/s/AKfycbxrvdQluH9CZ-FB8zzxQ3RUgnOSw2zYmo1kqXT61VZMAhpSZnTgpTrrUKTLdnw9PaspEw/exec';
const $ = id => document.getElementById(id);
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
let S = null, timer = null, rep = null;

const post = b => fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(b) }).then(r => r.text()).then(t => t.trim());
function note(id, text, ok) { const m = $(id); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); m.style.display = 'block'; }
function view(name) { ['setup', 'live', 'listbox'].forEach(s => $(s).style.display = s === name ? 'block' : 'none'); }
const randPin = () => String(Math.floor(1000 + Math.random() * 9000));
const PINOK = p => /^[A-Za-z0-9]{3,10}$/.test(p);
const studentLink = () => location.href.replace(/lecturer\.html.*$/, '') + 'index.html?s=' + S.session_id;

function showSetup() {
  clearInterval(timer); view('setup');
  $('spin').value = randPin(); $('email').value = ls.get('ep_email') || '';
}

$('start').onclick = async () => {
  const name = $('sname').value.trim(), pin = $('spin').value.trim(), email = $('email').value.trim();
  if (!name) return note('m1', 'Give the session a name.', false);
  if (!PINOK(pin)) return note('m1', 'The PIN needs 3 to 10 letters or numbers.', false);
  $('start').disabled = true;
  try {
    const r = await post({ action: 'start', name, pin, email, ask_regno: $('askreg').checked });
    if (r.startsWith('{')) { S = JSON.parse(r); ls.set('ep_session', JSON.stringify(S)); if (email) ls.set('ep_email', email); showLive(true); }
    else note('m1', r === 'BUSY' ? 'Too many sessions started. Try again later.' : 'Could not start. Try again.', false);
  } catch (e) { note('m1', 'No connection. Check your data and try again.', false); }
  $('start').disabled = false;
};

function showLive(fresh) {
  view('live');
  if (fresh) { $('qr').innerHTML = ''; new QRCode($('qr'), { text: studentLink(), width: 190, height: 190 }); }
  poll(); clearInterval(timer); timer = setInterval(poll, 5000);
}

async function poll() {
  let r;
  try { r = await post({ action: 'live', ...S }); } catch (e) { return; }
  if (r === 'BAD_SESSION') { ls.del('ep_session'); S = null; return showSetup(); }
  if (!r.startsWith('{')) return;
  const j = JSON.parse(r);
  $('lname').textContent = j.name;
  $('pinval').textContent = j.open ? j.pin : 'Closed';
  $('pinlabel').textContent = j.open ? 'Students enter this PIN' : 'Sign-in has ended';
  $('qrwrap').style.display = j.open ? 'block' : 'none';
  $('chpin').style.display = $('end').style.display = j.open ? 'block' : 'none';
  $('count').textContent = j.count + ' signed in' + (j.flagged ? ' (' + j.flagged + ' to check)' : '');
  S.pin = j.pin; S.name = j.name;
  if (!$('qr').firstChild && j.open) new QRCode($('qr'), { text: studentLink(), width: 190, height: 190 });
}

$('chpin').onclick = async () => {
  const p = (prompt('New PIN (3 to 10 letters or numbers)', S.pin || '') || '').trim();
  if (!p) return;
  if (!PINOK(p)) return alert('The PIN needs 3 to 10 letters or numbers.');
  await post({ action: 'setpin', ...S, pin: p }); poll();
};
$('end').onclick = async () => {
  if (!confirm('End sign-in? Students will no longer be able to sign in.')) return;
  await post({ action: 'end', ...S }); poll();
};
$('newsess').onclick = () => { if (!$('end').offsetParent || confirm('Start a new session? This one stays open until you end it.')) { ls.del('ep_session'); S = null; showSetup(); } };

const cell = (tr, t) => { const c = document.createElement('td'); c.textContent = t; tr.appendChild(c); };
async function loadList() {
  const r = await post({ action: 'list', ...S });
  if (!r.startsWith('{')) return note('m2', 'Could not load the list. Try again.', false);
  rep = JSON.parse(r);
  const hasReg = rep.rows.some(x => x.reg);
  $('ptitle').textContent = rep.name + ', ' + rep.date + ' (' + rep.rows.length + ')';
  const t = $('tbl'); t.innerHTML = '';
  const h = document.createElement('tr');
  (hasReg ? ['Reg No', 'Name', 'Time', ''] : ['Name', 'Time', '']).forEach(x => { const th = document.createElement('th'); th.textContent = x; h.appendChild(th); });
  t.appendChild(h);
  rep.rows.forEach(x => {
    const tr = document.createElement('tr');
    if (hasReg) cell(tr, x.reg);
    cell(tr, x.name); cell(tr, x.time); cell(tr, x.status === 'FLAGGED' ? 'CHECK' : x.status === 'MANUAL' ? 'added' : '');
    t.appendChild(tr);
  });
  rep.hasReg = hasReg;
}
$('viewlist').onclick = async () => { view('listbox'); $('m2').style.display = 'none'; await loadList(); };
$('back').onclick = () => showLive(false);

const q = v => { v = String(v == null ? '' : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
$('csv').onclick = () => {
  const head = rep.hasReg ? ['Reg No', 'Name', 'Time', 'Status'] : ['Name', 'Time', 'Status'];
  const rows = [head].concat(rep.rows.map(x => rep.hasReg ? [x.reg, x.name, x.time, x.status] : [x.name, x.time, x.status]));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv' }));
  a.download = rep.name.replace(/[^\w\- ]+/g, '') + '-' + rep.date + '.csv';
  a.click();
};
$('pdf').onclick = () => { document.body.classList.add('pl'); window.print(); document.body.classList.remove('pl'); };
$('mail').onclick = async () => {
  let to = ls.get('ep_email') || '';
  let r = await post({ action: 'email', ...S, email: to });
  if (r === 'NO_EMAIL') { to = (prompt('Your email address') || '').trim(); if (!to) return; ls.set('ep_email', to); r = await post({ action: 'email', ...S, email: to }); }
  note('m2', r === 'SENT' ? 'Sent to your email.' : 'Could not send: ' + r, r === 'SENT');
};
$('addbtn').onclick = async () => {
  const lines = $('paste').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!lines.length) return note('m2', 'Paste at least one row.', false);
  const r = await post({ action: 'manual', ...S, lines });
  if (r.startsWith('ADDED:')) { note('m2', 'Added ' + r.split(':')[1] + '.', true); $('paste').value = ''; loadList(); }
  else note('m2', 'Could not add: ' + r, false);
};

(async () => {
  const saved = ls.get('ep_session');
  if (saved) { try { S = JSON.parse(saved); showLive(false); return; } catch (e) { ls.del('ep_session'); } }
  showSetup();
})();
</script>
</body>
</html>
