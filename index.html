<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Presence | BrytMa Tech Uganda</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f8;color:#111;min-height:100vh;display:flex;flex-direction:column}
  main{width:100%;max-width:420px;margin:0 auto;padding:16px;flex:1}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .logo{background:linear-gradient(135deg,var(--b,#104898),#e80888);color:#fff;width:56px;height:56px;border-radius:14px;overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:1.2rem}
  .brand b{display:block;font-size:1.1rem}.brand span{font-size:.75rem;color:#555}
  h1{font-size:1.4rem;margin:8px 0 2px;word-break:break-word;text-align:center}h1+#sub{text-align:center}#lg img{width:100%;height:100%;object-fit:contain;background:#fff}
  label{display:block;margin-top:10px;font-weight:600;font-size:.9rem}
  input{width:100%;font-size:16px;padding:12px;margin-top:4px;border:2px solid #8a8f98;border-radius:10px;background:#fff}
  input:focus{outline:none;border-color:var(--b,#104898)}
  button{width:100%;font-size:1.05rem;padding:14px;margin-top:14px;border:0;border-radius:10px;background:var(--b,#104898);color:#fff;font-weight:700}
  button:disabled{opacity:.6}
  #msg{margin-top:12px;padding:12px;border-radius:10px;font-weight:600;display:none}
  .ok{background:#d6f5dc;color:#0a5c1f}.warn{background:#fff0c2;color:#6b4e00}.err{background:#fde0e0;color:#8a1111}
  #done{display:none;text-align:center;padding:24px 8px}
  #done .tick{font-size:3.5rem;line-height:1;color:#0a8a2f}
  .foot{font-size:.75rem;color:#666;text-align:center;padding:10px}
body{min-height:100vh;min-height:100dvh}main{display:flex;flex-direction:column}.foot{margin-top:auto}.foot a{color:var(--b,#104898);font-weight:700}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;overflow:auto;padding:14px;z-index:9}.sheet{background:#fff;color:#111;max-width:560px;margin:4vh auto;padding:16px;border-radius:14px}
.i{width:22px;height:22px}.tile{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;flex:none;background:color-mix(in srgb,var(--b,#104898) 14%,transparent);color:var(--b,#104898)}.tile .i{width:24px;height:24px}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:8px}.mt{display:flex;gap:10px;align-items:center;text-decoration:none;color:#111;border:1px solid #dfe5ee;border-radius:12px;padding:10px;background:#f6f8fc}.mt small{display:block;color:#5b6678;font-size:.76rem;margin-top:2px;font-weight:400}
</style>
</head>
<body>
<main>
  <header class="brand" style="flex-direction:column;text-align:center"><div class="logo" id="lg">E</div><b id="uni" style="font-size:1.15rem">E-Presence</b></header>
  <h1 id="ttl">Sign in</h1>
  <div id="sub" style="color:#444;margin-bottom:4px"></div>
  <div id="loading" style="color:#555;margin-top:12px">Loading...</div>
  <div id="form" style="display:none">
    <label id="regbox">Registration number (Reg No)<input id="reg" autocomplete="off" placeholder="e.g. 2024/BSE/108/PS"></label>
    <label>Full name<input id="name" autocomplete="name" placeholder="As on your student card"></label>
    <label>PIN shown by your lecturer<input id="pin" autocomplete="off" autocapitalize="none" inputmode="text" placeholder="PIN on the screen"></label>
    <button id="go">Sign in</button>
  </div>
  <div id="done"><div class="tick">&#10003;</div><h2 id="donetxt">You are signed in</h2><p id="donesub" style="color:#444"></p></div>
  <div id="msg"></div>
  <button id="again" style="display:none;background:#fff;color:var(--b,#104898);border:2px solid var(--b,#104898)">Check again</button>
<div class="foot">Built in Uganda<br>by BrytMa Tech Uganda &middot; <a href="#" id="abt">About</a></div>
</main>
<div id="ab" class="ovl" onclick="if(event.target===this)this.style.display='none'"><div class="sheet"><div id="abc"></div><button id="abx" style="background:transparent;color:var(--b,#104898);border:2px solid var(--b,#104898)">Done</button></div></div>

<script>
const ICP={"books": "M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2zM22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z", "software": "M12 3l8 4v10l-8 4-8-4V7zM4 7l8 4 8-4M12 11v10", "bi": "M4 20V10M10 20V4M16 20v-7M22 20H2", "powerbi": "M12 3v9h9a9 9 0 1 1-9-9zM15 3.5A9 9 0 0 1 20.5 9H15z", "oracle": "M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6", "pipelines": "M3 5h5v5H3zM16 5h5v5h-5zM9.5 14h5v5h-5zM8 7.5h8M12 7.5V14", "appdev": "M7 8l-4 4 4 4M17 8l4 4-4 4M14 5l-4 14"};
const ico=k=>`<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICP[k]}"/></svg>`;
const MORE=[['books','Books','Fiction and series, including God of Balimwezo, Rejections in Monaco and When Time Comes.'],['software','Commercial software','Practical tools built for real organisations.'],['bi','Business intelligence','Dashboards and reports that managers actually use.'],['powerbi','Microsoft Power BI','Reports, data models and custom visuals.'],['oracle','Oracle BI','Analytics on Oracle data platforms.'],['pipelines','Data pipelines','Reliable data movement from source to report.'],['appdev','Web & app development','Mobile and web apps, from idea to launch.']];
document.getElementById('abc').innerHTML=`<p><b>E-Presence</b><br>QR-code attendance that replaces paper sheets.</p><p style="color:#5b6678;font-size:.85rem">Built in Uganda by <b>BrytMa Tech Uganda</b><br><a href="mailto:muhumuzabright26@gmail.com" style="color:var(--b,#104898)">muhumuzabright26@gmail.com</a></p><h3 style="margin:14px 0 0;font-size:.95rem">More from BrytMa Tech</h3><div class="more">${MORE.map(([k,t,d])=>`<a class="mt" href="mailto:muhumuzabright26@gmail.com?subject=${encodeURIComponent('BrytMa Tech: '+t)}"><span class="tile">${ico(k)}</span><div><b>${t}</b><small>${d}</small></div></a>`).join('')}</div><p style="color:#5b6678;font-size:.8rem;margin-top:12px">No location tracking. Only your Reg No, name and sign-in time are stored, in your lecturer's own records.</p>`;
document.getElementById('abt').onclick=e=>{e.preventDefault();document.getElementById('ab').style.display='block'};document.getElementById('abx').onclick=()=>document.getElementById('ab').style.display='none';
const URL_ = 'https://script.google.com/macros/s/AKfycbxrvdQluH9CZ-FB8zzxQ3RUgnOSw2zYmo1kqXT61VZMAhpSZnTgpTrrUKTLdnw9PaspEw/exec';
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search), cid = qs.get('class'), sid = qs.get('s');
const target = cid ? { class_id: cid } : { session_id: sid };
let info = null;

function show(t, c) { const m = $('msg'); m.textContent = t; m.className = c; m.style.display = 'block'; }
function deviceId() {
  let id = localStorage.getItem('device_id');
  if (!id) { id = 'web-' + crypto.randomUUID(); localStorage.setItem('device_id', id); }
  return id;
}
async function post(body) {
  const send = () => fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) }).then(r => r.text());
  try { return (await send()).trim(); }
  catch (e) { await new Promise(r => setTimeout(r, 2000)); return (await send()).trim(); }
}

const MSG = {
  BAD_PIN: ['Wrong PIN. Check the PIN on your lecturer\'s screen.', 'err'],
  NO_OPEN_SESSION: ['Sign-in is not open right now. Ask your lecturer.', 'warn'],
  MISSING_INFO: ['Please fill in every box.', 'err'],
  TOO_MANY: ['Too many wrong tries. Wait 5 minutes and try again.', 'err']
};
const DONE = {
  OK: ['You are signed in', 'Thank you.'],
  OK_FLAGGED: ['You are signed in', 'Your lecturer may double-check this entry.'],
  ALREADY_MARKED: ['You are already signed in', 'Nothing more to do.']
};

async function init() {
  $('msg').style.display = 'none'; $('again').style.display = 'none'; $('form').style.display = 'none'; $('loading').style.display = 'block';
  if (!cid && !sid) { $('loading').style.display = 'none'; return show('This link is incomplete. Scan the QR code again.', 'err'); }
  try { info = JSON.parse(await (await fetch(URL_ + '?' + (cid ? 'class=' + encodeURIComponent(cid) : 's=' + encodeURIComponent(sid)))).text()); }
  catch (e) { $('loading').style.display = 'none'; $('again').style.display = 'block'; return show('No connection. Check your data and try again.', 'err'); }
  $('loading').style.display = 'none';
  if (info.name) { $('ttl').textContent = info.name; document.title = info.name + ' | E-Presence'; }
  $('sub').textContent = [info.title, info.welcome].filter(Boolean).join(' \u00b7 ');
  if (info.uni) $('uni').textContent = info.uni;
  if (/^data:image\/(png|jpeg);base64,/.test(info.logo || '')) { const im = new Image(); im.src = info.logo; $('lg').textContent = ''; $('lg').appendChild(im); }
  if (/^#[0-9a-fA-F]{6}$/.test(info.color || '')) document.documentElement.style.setProperty('--b', info.color);
  if (!info.open) { $('again').style.display = 'block'; return show('Sign-in is not open right now. Ask your lecturer, then tap Check again.', 'warn'); }
  $('regbox').style.display = info.ask_regno ? 'block' : 'none';
  $('reg').value = localStorage.getItem('last_reg') || '';
  $('name').value = localStorage.getItem('last_name') || '';
  $('form').style.display = 'block';
  ($('reg').value && $('name').value ? $('pin') : info.ask_regno ? $('reg') : $('name')).focus();
}
$('again').onclick = init;
init();

$('go').onclick = async () => {
  const reg = $('reg').value.trim(), name = $('name').value.trim(), pin = $('pin').value.trim();
  if ((info.ask_regno && !reg) || !name || !pin) return show(MSG.MISSING_INFO[0], 'err');
  $('go').disabled = true; $('msg').style.display = 'none';
  let res;
  try { res = await post({ ...target, pin, reg_no: reg, name, device_id: deviceId() }); }
  catch (e) { $('go').disabled = false; return show('No connection. Check your data and try again.', 'err'); }
  $('go').disabled = false;
  if (DONE[res]) {
    localStorage.setItem('last_reg', reg); localStorage.setItem('last_name', name);
    $('form').style.display = 'none'; $('msg').style.display = 'none';
    $('donetxt').textContent = DONE[res][0]; $('donesub').textContent = name + '. ' + DONE[res][1];
    $('done').style.display = 'block';
  } else {
    const m = MSG[res] || ['Something went wrong. Try again.', 'err'];
    show(m[0], m[1]);
    if (res === 'BAD_PIN') { $('pin').value = ''; $('pin').focus(); }
  }
};
</script>
</body>
</html>
